[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-probe"
version = "0.1.0"
description = "Lightweight, local-first white-box trajectory evaluation & replay harness for AI Agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "agent-evaluation",
    "trajectory-diff",
    "agent-harness",
    "llm-testing",
    "white-box-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/Ztwo02/Agent-probe"
Repository = "https://github.com/Ztwo02/Agent-probe"
Issues = "https://github.com/Ztwo02/Agent-probe/issues"
"Live Demo" = "https://ztwo02.github.io/Agent-probe/"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-probe = "agent_probe.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_probe = ["reporter/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
